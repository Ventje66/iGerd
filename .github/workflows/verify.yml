name: Verify

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Companion server
        run: ./scripts/verify-environment.sh

      - name: Claude Code installer
        run: ./scripts/verify-plugin-install.sh

      - name: Cursor plugin manifest
        run: ./scripts/verify-cursor-plugin.sh
