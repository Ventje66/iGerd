[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gerdgraph"
version = "0.1.0"
description = "A graph engineering scaffold: model, migrate, ingest, query, verify."
requires-python = ">=3.10"
dependencies = ["kuzu>=0.7"]

[project.optional-dependencies]
neo4j = ["neo4j>=5.14"]
dev = ["pytest>=7.4"]

[project.scripts]
gerdgraph = "gerdgraph.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
