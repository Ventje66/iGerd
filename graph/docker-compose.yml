# Bring up the server backend:
#
#   docker compose up -d
#   export GRAPH_BACKEND=neo4j NEO4J_PASSWORD=gerdgraph
#   python -m gerdgraph migrate && python -m gerdgraph ingest
#   pytest                      # the same suite, against Neo4j
#
# The point of running both is that a query passing on one engine and failing on
# the other is information. Suppressing that difference costs you the information.
services:
  neo4j:
    image: neo4j:5-community
    ports:
      - "7474:7474"   # browser
      - "7687:7687"   # bolt
    environment:
      NEO4J_AUTH: neo4j/gerdgraph
      NEO4J_server_memory_heap_max__size: 512M
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "gerdgraph", "RETURN 1"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - neo4j_data:/data

volumes:
  neo4j_data:
